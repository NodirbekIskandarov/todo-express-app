<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Eslatma</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { background: var(--bg-panel); }

    .card {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-panel);
      overflow: hidden;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }
    .head .bell { font-size: 19px; }
    .head h1 { margin: 0; font-size: 15px; font-weight: 650; }
    .head .sub { margin-left: auto; color: var(--text-faint); font-size: 12px; }

    .list { flex: 1; overflow-y: auto; padding: 6px 10px; }

    .item {
      display: flex;
      gap: 10px;
      padding: 9px 8px;
      border-radius: 9px;
    }
    .item + .item { border-top: 1px solid var(--border); }
    .item .mark { flex: none; font-size: 14px; line-height: 1.5; }
    .item .body { min-width: 0; }
    .item .t { font-weight: 600; overflow-wrap: anywhere; }
    .item .m {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--text-faint);
    }

    .foot {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    .foot .spacer { flex: 1; }
    .foot .primary-btn { padding: 8px 26px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="bell">🔔</span>
      <h1 id="head-title">Eslatma</h1>
      <span class="sub" id="head-sub"></span>
    </div>

    <div class="list" id="list"></div>

    <div class="foot">
      <button class="ghost-btn" id="btn-open">Dasturni ochish</button>
      <span class="spacer"></span>
      <button class="primary-btn" id="btn-ok">OK</button>
    </div>
  </div>

  <script src="reminder.js"></script>
</body>
</html>
